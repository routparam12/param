name: Sync portfolio projects

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate portfolio cards
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          # Empty by default; used only when summary_provider is set to "api".
          PORTFOLIO_AI_API_KEY: ${{ secrets.PORTFOLIO_AI_API_KEY }}
        run: python scripts/sync_github_projects.py
      - name: Commit generated portfolio updates
        run: |
          if git diff --quiet -- data/portfolio-sync.json data/projects.generated.json projects.html index.html; then
            echo "No portfolio changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-sync.json data/projects.generated.json projects.html index.html
          git commit -m "chore: sync portfolio projects"
          git push
